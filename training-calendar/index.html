<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Календарь записи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #e8cbcb;
      --surface: #fffdf9;
      --surface-soft: #f1ece5;
      --border: #dab8b8;
      --text: #3c3a37;
      --text-soft: #6f675e;
      --accent: #8f9b82;
      --accent-strong: #79876a;
      --accent-contrast: #ffffff;
      --cell-hover: #ebe4db;
      --selected: #d9e1d0;
      --shadow: rgba(60, 58, 55, 0.08);
      --radius-m: 12px;
      --radius-s: 8px;
      --space-4: 4px;
      --space-8: 8px;
      --space-12: 12px;
      --space-16: 16px;
      --space-20: 20px;
      --space-24: 24px;
      --space-32: 32px;
      --cell-width: 96px;
      --cell-height: 72px;
      --time-cell-width: 80px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #efe8de 100%);
      color: var(--text);
      padding: var(--space-12);
    }

    header,
    main,
    footer {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      margin-bottom: var(--space-16);
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-12);
      flex-wrap: wrap;
    }

    .week-nav {
      display: flex;
      align-items: center;
      gap: var(--space-8);
    }

    .next-week-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: var(--space-8) var(--space-12);
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .next-week-btn:hover {
      background: var(--cell-hover);
      border-color: var(--accent);
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-m);
      box-shadow: 0 10px 24px var(--shadow);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: var(--space-20);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: var(--space-12);
      text-align: center;
      vertical-align: middle;
      background: var(--surface);
      width: var(--cell-width);
      min-width: var(--cell-width);
      max-width: var(--cell-width);
      height: var(--cell-height);
      font-size: 0.82rem;
    }

    thead th {
      background: var(--surface-soft);
      color: var(--text-soft);
      font-weight: 600;
      font-size: 0.9rem;
      min-width: 112px;
      height: 40px;
    }

    #week-header-row th:first-child {
      width: var(--time-cell-width);
      min-width: var(--time-cell-width);
      max-width: var(--time-cell-width);
    }

    .time-cell {
      width: var(--time-cell-width);
      min-width: var(--time-cell-width);
      max-width: var(--time-cell-width);
      font-weight: 600;
      color: var(--text-soft);
      background: var(--surface-soft);
    }

    .slot-btn {
      width: 100%;
      min-height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      background: transparent;
      color: var(--text);
      padding: var(--space-8) var(--space-4);
      font: inherit;
      font-size: 0.8rem;
      line-height: 1.2;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .slot-btn:hover {
      background: var(--cell-hover);
      border-color: var(--accent);
    }

    .slot-btn.selected {
      background: var(--selected);
      border-color: var(--accent);
      color: #33432b;
      font-weight: 600;
    }

    .slot-btn:disabled {
      cursor: not-allowed;
      background: #f3efe9;
      color: #9b9389;
      border-color: #d9d1c7;
    }

    .slot-btn:disabled:hover {
      background: #f3efe9;
      border-color: #d9d1c7;
    }

    .slot-empty {
      min-height: 100%;
      background: var(--surface);
    }

    footer {
      display: flex;
      justify-content: center;
      padding-bottom: var(--space-24);
    }

    .submit-btn {
      width: 100%;
      max-width: 100%;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-contrast);
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: var(--space-12) var(--space-20);
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      opacity: 0.5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-8);
    }

    .submit-btn:disabled {
      cursor: not-allowed;
    }

    .submit-btn:not(:disabled) {
      opacity: 1;
    }

    .submit-btn:not(:disabled):hover {
      background: var(--accent-strong);
    }

    .submit-btn__loader {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .submit-btn.is-loading .submit-btn__loader {
      display: inline-block;
    }

    .submit-btn.is-loading .submit-btn__text {
      opacity: 0.9;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 768px) {
      :root {
        --cell-width: 124px;
        --cell-height: 84px;
      }

      body {
        padding: var(--space-32) var(--space-24);
      }

      header {
        margin-bottom: var(--space-20);
      }

      h1 {
        font-size: clamp(1.4rem, 4vw, 2rem);
      }

      table {
        min-width: 680px;
      }

      th,
      td {
        font-size: 0.9rem;
      }

      .slot-btn {
        font-size: 0.9rem;
      }

      .submit-btn {
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Выбери тренировку и нажми Записаться</h1>
      <div class="week-nav">
        <button id="prev-week-btn" class="next-week-btn" type="button">←</button>
        <button id="next-week-btn" class="next-week-btn" type="button">→</button>
      </div>
    </div>
  </header>

  <main>
    <section class="table-wrap" aria-label="Расписание тренировок">
      <table>
        <thead>
          <tr id="week-header-row"></tr>
        </thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <button id="enroll-btn" class="submit-btn" type="button" disabled>
      <span class="submit-btn__text">Записаться</span>
      <span class="submit-btn__loader" aria-hidden="true"></span>
    </button>
  </footer>

  <script src="./mini-app-utils.bundle.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const weekdays = [
        { key: "mon", label: "Пн" },
        { key: "tue", label: "Вт" },
        { key: "wed", label: "Ср" },
        { key: "thu", label: "Чт" },
        { key: "fri", label: "Пт" },
        { key: "sat", label: "Сб" },
        { key: "sun", label: "Вс" }
      ];

      const trainings = [
        { name: "Pilates", day: "mon", time: 9 },
        { name: "Pilates", day: "wed", time: 9 },
        { name: "Pilates", day: "fri", time: 9 },
        { name: "Functional move", day: "tue", time: 11 },
        { name: "Functional move", day: "thu", time: 11 },
        { name: "Glutes + upper body", day: "mon", time: 10},
        { name: "Glutes + upper body", day: "fri", time: 10},
        { name: "Glutes + Core", day: "wed", time: 10 }
      ];

      const weekHeaderRow = document.getElementById("week-header-row");
      const scheduleBody = document.getElementById("schedule-body");
      const enrollButton = document.getElementById("enroll-btn");
      const prevWeekButton = document.getElementById("prev-week-btn");
      const nextWeekButton = document.getElementById("next-week-btn");
      const miniAppUtils = window.MiniAppUtils;

      let selectedSlot = null;
      let weekOffset = 0;
      let isSubmitting = false;

      if (miniAppUtils && typeof miniAppUtils.initMiniAppUtils === "function") {
        miniAppUtils.initMiniAppUtils();
      }
      if (miniAppUtils && typeof miniAppUtils.initMiniApp === "function") {
        miniAppUtils.initMiniApp().catch(function (error) {
          console.warn("Mini app init failed:", error);
        });
      }

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function formatDate(date) {
        return pad(date.getDate()) + "." + pad(date.getMonth() + 1);
      }

      function formatPayloadDate(date) {
        return pad(date.getDate()) + ":" + pad(date.getMonth() + 1) + ":" + date.getFullYear();
      }

      function formatTime(time) {
        return String(time).padStart(2, "0") + ":00";
      }

      function getMonday(today) {
        const date = new Date(today);
        const day = date.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        date.setDate(date.getDate() + diff);
        if (day === 5 || day === 6 || day === 0) {
          date.setDate(date.getDate() + 7);
        }
        date.setHours(0, 0, 0, 0);
        return date;
      }

      function buildWeekDates(offsetWeeks) {
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        const monday = getMonday(new Date());
        monday.setDate(monday.getDate() + offsetWeeks * 7);
        return weekdays.map(function (weekday, index) {
          const date = new Date(monday);
          date.setDate(monday.getDate() + index);
          date.setHours(0, 0, 0, 0);
          return {
            key: weekday.key,
            label: weekday.label,
            dateLabel: formatDate(date),
            payloadDate: formatPayloadDate(date),
            isSelectable: date.getTime() > todayStart.getTime()
          };
        });
      }

      function renderHeader(weekDates) {
        const timeHeader = document.createElement("th");
        timeHeader.textContent = "Время";
        weekHeaderRow.appendChild(timeHeader);

        weekDates.forEach(function (day) {
          const th = document.createElement("th");
          th.textContent = day.label + " " + day.dateLabel;
          weekHeaderRow.appendChild(th);
        });
      }

      function buildTrainingMap() {
        const map = new Map();
        trainings.forEach(function (training) {
          const key = training.day + "-" + training.time;
          if (!map.has(key)) {
            map.set(key, []);
          }
          map.get(key).push(training.name);
        });
        return map;
      }

      function getVisibleTimes() {
        const times = new Set();
        trainings.forEach(function (training) {
          if (training.time >= 7 && training.time <= 18) {
            times.add(training.time);
          }
        });
        return Array.from(times).sort(function (a, b) {
          return a - b;
        });
      }

      function clearSelection() {
        const selected = document.querySelector(".slot-btn.selected");
        if (selected) {
          selected.classList.remove("selected");
        }
      }

      function handleSlotSelect(button) {
        clearSelection();
        button.classList.add("selected");

        selectedSlot = {
          name: button.dataset.trainingName,
          day: button.dataset.dayLabel,
          date: button.dataset.payloadDate,
          time: button.dataset.timeLabel
        };

        enrollButton.disabled = isSubmitting;
      }

      function setEnrollLoading(shouldLoad) {
        isSubmitting = shouldLoad;
        enrollButton.classList.toggle("is-loading", shouldLoad);
        enrollButton.disabled = shouldLoad || !selectedSlot;
      }

      function renderTableRows(weekDates, trainingMap, visibleTimes) {
        visibleTimes.forEach(function (time) {
          const row = document.createElement("tr");

          const timeCell = document.createElement("td");
          timeCell.className = "time-cell";
          timeCell.textContent = formatTime(time);
          row.appendChild(timeCell);

          weekDates.forEach(function (day) {
            const cell = document.createElement("td");
            const key = day.key + "-" + time;
            const trainingNames = trainingMap.get(key);

            if (trainingNames && trainingNames.length > 0) {
              trainingNames.forEach(function (trainingName) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "slot-btn";
                button.textContent = trainingName;
                button.dataset.trainingName = trainingName;
                button.dataset.dayLabel = day.label;
                button.dataset.dateLabel = day.dateLabel;
                button.dataset.payloadDate = day.payloadDate;
                button.dataset.timeLabel = formatTime(time);

                if (day.isSelectable) {
                  button.addEventListener("click", function () {
                    handleSlotSelect(button);
                  });
                } else {
                  button.disabled = true;
                }

                cell.appendChild(button);
              });
            } else {
              const emptyState = document.createElement("div");
              emptyState.className = "slot-empty";
              cell.appendChild(emptyState);
            }

            row.appendChild(cell);
          });

          scheduleBody.appendChild(row);
        });
      }

      function init() {
        const weekDates = buildWeekDates(weekOffset);
        const trainingMap = buildTrainingMap();
        const visibleTimes = getVisibleTimes();

        weekHeaderRow.innerHTML = "";
        scheduleBody.innerHTML = "";
        clearSelection();
        selectedSlot = null;
        setEnrollLoading(false);
        enrollButton.disabled = true;
        prevWeekButton.disabled = weekOffset === 0;

        renderHeader(weekDates);
        renderTableRows(weekDates, trainingMap, visibleTimes);
      }

      prevWeekButton.addEventListener("click", function () {
        if (weekOffset === 0) {
          return;
        }
        weekOffset -= 1;
        init();
      });

      nextWeekButton.addEventListener("click", function () {
        weekOffset += 1;
        init();
      });

      enrollButton.addEventListener("click", async function () {
        if (!selectedSlot || isSubmitting) {
          return;
        }

        setEnrollLoading(true);

        const payload = {
          training: selectedSlot.name,
          day: selectedSlot.day,
          date: selectedSlot.date,
          time: selectedSlot.time
        };
        const apiUrl = "https://web-production-b2434.up.railway.app";

        if (!miniAppUtils || typeof miniAppUtils.sendSignalToAdmin !== "function") {
          console.error("Mini app utils are not available. Build mini-app-utils.bundle.js first.");
          alert("Сервис отправки недоступен. Обновите страницу или попробуйте позже.");
          setEnrollLoading(false);
          return;
        }

        try {
          await miniAppUtils.sendSignalToAdmin(payload, apiUrl);
        } finally {
          setEnrollLoading(false);
        }

      });

      init();
    });
  </script>
</body>
</html>
