        /* Side Highlight Hover Effect */
        .side-glow-hover {
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .side-glow-hover:hover {
            transform: translateX(10px);
            text-shadow: 0 0 15px rgba(217, 70, 239, 0.4);
        }
        .side-glow-hover::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 10%;
            height: 80%;
            width: 3px;
            background: #d946ef;
            box-shadow: 0 0 15px #d946ef;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .side-glow-hover:hover::before {
            opacity: 1;
            left: -10px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #d946ef;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #22d3ee;
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(217, 70, 239, 0.4);
