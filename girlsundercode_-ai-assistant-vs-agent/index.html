    <script>
        (function () {
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const isAppRootPath = /^\/girlsundercode_-ai-assistant-vs-agent\/?(index\.html)?$/.test(window.location.pathname);
            const isDistPath = window.location.pathname.includes('/dist/');

            // In production static hosting, this source entry should redirect to built assets.
            if (!isLocalhost && isAppRootPath && !isDistPath) {
                window.location.replace('./dist/index.html');
            }
        })();
    </script>

    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Initialize WebApp immediately after script loads -->
    <script>
        // Wait for Telegram WebApp to be ready
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                console.log('🚀 Telegram WebApp script loaded successfully');
                window.Telegram.WebApp.ready();
                console.log('✅ Telegram WebApp initialized');
            } else {
                console.log('⚠️ Telegram WebApp script loaded but API not available');
                // Try again in a moment
                setTimeout(initTelegramWebApp, 100);
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTelegramWebApp);
        } else {
            initTelegramWebApp();
        }

        // Also try on window load
        window.addEventListener('load', initTelegramWebApp);

        // Additional initialization for InlineKeyboardButton WebApps
        setTimeout(() => {
            if (!window.Telegram?.WebApp) {
                console.log('🔄 Retrying Telegram WebApp initialization...');
                initTelegramWebApp();
            }
        }, 2000);
    </script>

        /* Side Highlight Hover Effect */
        .side-glow-hover {
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .side-glow-hover:hover {
            transform: translateX(10px);

        .side-glow-hover::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 10%;

            width: 3px;
            background: #d946ef;
            box-shadow: 0 0 15px #d946ef;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .side-glow-hover:hover::before {
            opacity: 1;
            left: -10px;
        }

        /* Custom scrollbar */
