    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Initialize WebApp immediately after script loads -->
    <script>
        // Wait for Telegram WebApp to be ready
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                console.log('🚀 Telegram WebApp script loaded successfully');
                window.Telegram.WebApp.ready();
                console.log('✅ Telegram WebApp initialized');
            } else {
                console.log('⚠️ Telegram WebApp script loaded but API not available');
                // Try again in a moment
                setTimeout(initTelegramWebApp, 100);
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTelegramWebApp);
        } else {
            initTelegramWebApp();
        }

        // Also try on window load
        window.addEventListener('load', initTelegramWebApp);

        // Additional initialization for InlineKeyboardButton WebApps
        // They may need more time to initialize
        setTimeout(() => {
            if (!window.Telegram?.WebApp) {
                console.log('🔄 Retrying Telegram WebApp initialization...');
                initTelegramWebApp();
            }
        }, 2000);

        // Check for start_param (common in InlineKeyboardButton WebApps)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const startParam = window.Telegram?.WebApp?.initDataUnsafe?.start_param;
                if (startParam) {
                    console.log('📋 WebApp opened with start_param:', startParam);
                    // You can use start_param to determine the context
                }
            }, 500);
        });
    </script>
