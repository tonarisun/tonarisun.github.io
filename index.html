<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIRLS UNDER CODE</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --btn-bg: #111111;
      --btn-border: #ffffff;
      --btn-hover: #ffffff;
      --btn-hover-text: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.08em;
      margin-bottom: 32px;
    }

    .buttons {
      display: grid;
      gap: 14px;
    }

    button {
      width: 100%;
      border: 2px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      padding: 14px 18px;
      font-size: 1rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button:hover {
      background: var(--btn-hover);
      color: var(--btn-hover-text);
    }
  </style>
</head>
<body>
  <main>
    <h1>GIRLS UNDER CODE</h1>
    <div class="buttons">
      <button type="button">Кнопка 1</button>
      <button type="button">Кнопка 2</button>
      <button type="button">Кнопка 3</button>
    </div>
  </main>
</body>
</html>
