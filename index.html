<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIRLS UNDER CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --btn-bg: #111111;
      --btn-border: #ffffff;
      --btn-hover: #ffffff;
      --btn-hover-text: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.08em;
      margin-bottom: 32px;
      font-family: "Orbitron", Arial, sans-serif;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      background: linear-gradient(90deg, #d946ef 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 25px rgba(217, 70, 239, 0.9);
    }

    .buttons {
      display: grid;
      gap: 14px;
    }

    button {
      width: 100%;
      border: 2px solid var(--btn-border);
      border-radius: 15px;
      background: var(--btn-bg);
      color: var(--text);
      padding: 14px 18px;
      font-size: 1rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button:hover {
      background: var(--btn-hover);
      color: var(--btn-hover-text);
    }
  </style>
</head>
<body>
  <main>
    <h1>GIRLS UNDER CODE</h1>
    <div class="buttons">
      <button id="go-to-app" type="button">AI ассистенты и агенты</button>
      <button id="go-to-quiz" type="button">КВИЗ</button>
      <button id="go-to-botlab" type="button">БОТЛАБ</button>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const appButton = document.getElementById("go-to-app");
      const quizButton = document.getElementById("go-to-quiz");
      const botlabButton = document.getElementById("go-to-botlab");

      if (appButton) {
        appButton.addEventListener("click", function () {
          window.location.href = "./girlsundercode_-ai-assistant-vs-agent/dist/index.html";
        });
      }

      if (quizButton) {
        quizButton.addEventListener("click", function () {
          window.location.href = "./neon-ai-quiz-tablet/dist/index.html";
        });
      }

      if (botlabButton) {
        botlabButton.addEventListener("click", function () {
          window.location.href = "./botlab/dist/index.html";
        });
      }
    });
  </script>
</body>
</html>
